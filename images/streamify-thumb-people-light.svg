<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F1EA"/>
      <stop offset="55%" stop-color="#EDE7DC"/>
      <stop offset="100%" stop-color="#F5F1EA"/>
    </linearGradient>
    <radialGradient id="glowC1" cx="50%" cy="10%" r="75%">
      <stop offset="0%" stop-color="#FF8B5E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF8B5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EBDD"/>
    </linearGradient>
    <linearGradient id="btnG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9D6C"/>
      <stop offset="100%" stop-color="#FF6B45"/>
    </linearGradient>
    <filter id="shC1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- reusable person illustrations -->
  <g id="personRia">
    <circle cx="0" cy="0" r="34" fill="#F2C29B"/>
    <path d="M-34 -6 a34 34 0 0 1 68 0 l0 -8 a34 30 0 0 0 -68 0 z" fill="#5A3825"/>
    <circle cx="-11" cy="-2" r="3" fill="#2B2419"/>
    <circle cx="11" cy="-2" r="3" fill="#2B2419"/>
    <path d="M-9 12 q9 8 18 0" stroke="#2B2419" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g id="personSam">
    <circle cx="0" cy="0" r="34" fill="#D9A574"/>
    <path d="M-34 4 q0 -38 34 -38 q34 0 34 38 q-10 -14 -34 -14 q-24 0 -34 14 z" fill="#1F1A16"/>
    <circle cx="-11" cy="-2" r="3" fill="#2B2419"/>
    <circle cx="11" cy="-2" r="3" fill="#2B2419"/>
    <path d="M-9 13 q9 7 18 0" stroke="#2B2419" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g id="personMia">
    <circle cx="0" cy="0" r="34" fill="#8D5A3B"/>
    <path d="M-32 6 a32 30 0 0 1 64 0 c2 -20 -8 -34 -32 -34 c-24 0 -34 14 -32 34 z" fill="#12100E"/>
    <circle cx="-11" cy="-1" r="3" fill="#12100E"/>
    <circle cx="11" cy="-1" r="3" fill="#12100E"/>
    <path d="M-9 13 q9 7 18 0" stroke="#12100E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g id="personAlex">
    <circle cx="0" cy="0" r="34" fill="#F4D0AC"/>
    <path d="M-30 -10 q30 -22 60 0 q4 10 -2 18 q-4 -14 -28 -14 q-24 0 -28 14 q-6 -8 -2 -18 z" fill="#C97A3A"/>
    <circle cx="-11" cy="-2" r="3" fill="#2B2419"/>
    <circle cx="11" cy="-2" r="3" fill="#2B2419"/>
    <path d="M-9 12 q9 8 18 0" stroke="#2B2419" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="750" fill="url(#bgC1)"/>
  <rect width="1200" height="750" fill="url(#glowC1)"/>

  <text x="70" y="70" font-family="Poppins, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#2B2419">Streamify</text>
  <text x="70" y="98" font-family="'Segoe UI', sans-serif" font-size="17" fill="#7A6E58">Login &#183; Chat &#183; Live Video &#8212; all in one place</text>

  <!-- PANEL 1: Login -->
  <g filter="url(#shC1)">
    <rect x="70" y="140" width="300" height="470" rx="16" fill="url(#panelG1)" stroke="#E2D9C7" stroke-width="1.2"/>
  </g>
  <use href="#personRia" transform="translate(220,206) scale(0.72)"/>
  <text x="220" y="256" font-family="Poppins, sans-serif" font-size="19" font-weight="700" fill="#2B2419" text-anchor="middle">Welcome back</text>
  <text x="220" y="278" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8A7C63" text-anchor="middle">Sign in to continue</text>

  <rect x="100" y="306" width="240" height="34" rx="8" fill="#F2EBDD" stroke="#E2D9C7"/>
  <text x="114" y="328" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9A8D74">Email address</text>

  <rect x="100" y="352" width="240" height="34" rx="8" fill="#F2EBDD" stroke="#E2D9C7"/>
  <text x="114" y="374" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9A8D74">Password</text>

  <rect x="100" y="402" width="240" height="38" rx="10" fill="url(#btnG1)"/>
  <text x="220" y="426" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F5F1EA" text-anchor="middle">Sign In</text>

  <line x1="100" y1="464" x2="340" y2="464" stroke="#E2D9C7"/>
  <text x="220" y="498" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9A8D74" text-anchor="middle">Don't have an account?</text>
  <text x="220" y="518" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FF9D6C" text-anchor="middle">Create one</text>

  <!-- PANEL 2: Chat -->
  <g filter="url(#shC1)">
    <rect x="400" y="140" width="330" height="470" rx="16" fill="url(#panelG1)" stroke="#E2D9C7" stroke-width="1.2"/>
  </g>
  <text x="424" y="176" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#2B2419">Messages</text>

  <use href="#personSam" transform="translate(440,222) scale(0.5)"/>
  <rect x="470" y="212" width="150" height="10" rx="5" fill="#D8CBB2"/>
  <rect x="470" y="230" width="110" height="8" rx="4" fill="#E7DCC6"/>
  <circle cx="700" cy="220" r="5" fill="#FF6B45"/>

  <use href="#personMia" transform="translate(440,280) scale(0.5)"/>
  <rect x="470" y="270" width="130" height="10" rx="5" fill="#D8CBB2"/>
  <rect x="470" y="288" width="120" height="8" rx="4" fill="#E7DCC6"/>

  <use href="#personAlex" transform="translate(440,338) scale(0.5)"/>
  <rect x="470" y="328" width="140" height="10" rx="5" fill="#D8CBB2"/>
  <rect x="470" y="346" width="90" height="8" rx="4" fill="#E7DCC6"/>

  <use href="#personRia" transform="translate(440,396) scale(0.5)"/>
  <rect x="470" y="386" width="120" height="10" rx="5" fill="#D8CBB2"/>
  <rect x="470" y="404" width="130" height="8" rx="4" fill="#E7DCC6"/>
  <circle cx="700" cy="394" r="5" fill="#FF6B45"/>

  <line x1="424" y1="440" x2="706" y2="440" stroke="#E2D9C7"/>

  <rect x="424" y="462" width="170" height="34" rx="14" fill="#F2EBDD"/>
  <text x="440" y="484" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5A4E38">Hey, joining now?</text>

  <rect x="536" y="506" width="194" height="34" rx="14" fill="url(#btnG1)"/>
  <text x="552" y="528" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F5F1EA" font-weight="600">Yes! Starting the call</text>

  <rect x="424" y="586" width="306" height="36" rx="18" fill="#F2EBDD" stroke="#E2D9C7"/>
  <text x="440" y="608" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9A8D74">Type a message&#8230;</text>

  <!-- PANEL 3: Video call -->
  <g filter="url(#shC1)">
    <rect x="760" y="140" width="370" height="470" rx="16" fill="url(#panelG1)" stroke="#E2D9C7" stroke-width="1.2"/>
  </g>
  <rect x="784" y="164" width="322" height="176" rx="10" fill="#F2EBDD"/>
  <use href="#personMia" transform="translate(945,252) scale(1.05)"/>
  <rect x="800" y="178" width="60" height="22" rx="11" fill="#FF5D5D"/>
  <circle cx="812" cy="189" r="4" fill="#FFFFFF"/>
  <text x="822" y="193" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">LIVE</text>

  <rect x="784" y="352" width="154" height="118" rx="10" fill="#F2EBDD"/>
  <use href="#personSam" transform="translate(861,411) scale(0.72)"/>

  <rect x="952" y="352" width="154" height="118" rx="10" fill="#F2EBDD"/>
  <use href="#personAlex" transform="translate(1029,411) scale(0.72)"/>

  <g transform="translate(945,540)">
    <circle cx="-70" cy="0" r="24" fill="#16323C"/>
    <circle cx="0" cy="0" r="24" fill="#16323C"/>
    <circle cx="70" cy="0" r="24" fill="#FF5D5D"/>
    <rect x="-78" y="-3" width="16" height="6" rx="3" fill="#8FD9C4"/>
    <rect x="-8" y="-8" width="16" height="16" rx="8" fill="#8FD9C4"/>
    <rect x="62" y="-8" width="16" height="8" rx="4" fill="#FFFFFF"/>
  </g>

  <text x="945" y="600" font-family="'Segoe UI', sans-serif" font-size="13" fill="#7A6E58" text-anchor="middle">HD video &#183; low latency &#183; screen share</text>

  <g font-family="'Segoe UI', sans-serif" font-size="13" fill="#F5F1EA">
    <rect x="784" y="626" width="66" height="26" rx="13" fill="#8FD9C4"/>
    <text x="817" y="643" text-anchor="middle" font-weight="700">React</text>
    <rect x="858" y="626" width="82" height="26" rx="13" fill="#9BB8FF"/>
    <text x="899" y="643" text-anchor="middle" font-weight="700">Node.js</text>
    <rect x="948" y="626" width="90" height="26" rx="13" fill="#FFD98F"/>
    <text x="993" y="643" text-anchor="middle" font-weight="700">WebRTC</text>
  </g>
</svg>
